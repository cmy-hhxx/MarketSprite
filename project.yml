name: MarketSprite
options:
  bundleIdPrefix: io.github.cmy-hhxx
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CURRENT_PROJECT_VERSION: 6
    MARKETING_VERSION: 0.6.0
    CODE_SIGN_STYLE: Automatic
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.11.1
targets:
  MarketSprite:
    type: application
    platform: macOS
    sources:
      - path: MarketSprite
        excludes:
          - Resources/Sounds/README.md
    dependencies:
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.cmy-hhxx.marketsprite
        PRODUCT_NAME: MarketSprite
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MarketSprite
        INFOPLIST_KEY_CFBundleDevelopmentRegion: zh_CN
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "仅供个人辅助查看，不构成投资建议"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - MarketSpriteTests
  MarketSpriteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MarketSpriteTests
    dependencies:
      - target: MarketSprite
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.cmy-hhxx.marketsprite.tests
        GENERATE_INFOPLIST_FILE: YES
  MarketSpritePerformanceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MarketSpritePerformanceTests
    dependencies:
      - target: MarketSprite
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.cmy-hhxx.marketsprite.performance-tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MarketSpritePerformance:
    build:
      targets:
        MarketSprite: all
        MarketSpritePerformanceTests: [test]
    test:
      targets:
        - MarketSpritePerformanceTests
