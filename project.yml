name: MingyHUD
options:
  bundleIdPrefix: com.mingyhud
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CURRENT_PROJECT_VERSION: 4
    MARKETING_VERSION: 0.3.0
    CODE_SIGN_STYLE: Automatic
targets:
  MingyHUD:
    type: application
    platform: macOS
    sources:
      - path: StockPet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mingyhud.app
        PRODUCT_NAME: MingyHUD
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MingyHUD
        INFOPLIST_KEY_CFBundleDevelopmentRegion: zh_CN
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "仅供个人辅助查看，不构成投资建议"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - StockPetTests
  StockPetTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: StockPetTests
    dependencies:
      - target: MingyHUD
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mingyhud.StockPetTests
        GENERATE_INFOPLIST_FILE: YES
